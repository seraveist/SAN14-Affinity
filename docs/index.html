<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>삼국지14 친애 편성기</title>
    <script>
      (() => {
        const stored = localStorage.getItem("san14-theme");
        const systemDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches;
        document.documentElement.dataset.theme = stored || (systemDark ? "dark" : "light");
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=1.4" />
  </head>
  <body>
    <main class="lab-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">14</span>
          <div class="brand-copy">
            <h1>삼국지14 친애 편성기</h1>
            <p>v1.4</p>
          </div>
        </div>

        <div class="segmented" role="tablist" aria-label="분석 모드">
          <button class="segment active" type="button" data-mode="roster">보유 장수 편성</button>
          <button class="segment" type="button" data-mode="single">단일 장수 분석</button>
        </div>

        <button id="themeToggle" class="theme-toggle" type="button" aria-label="다크 테마로 변경">☾</button>
      </header>

      <section class="control-workbench" aria-label="입력 패널">
        <section class="form-section roster-panel" data-panel="roster">
          <div class="input-card roster-entry">
            <div class="input-card-header">
              <label for="rosterInput">보유 장수</label>
              <details class="preset-popover">
                <summary>장수 프리셋</summary>
                <div class="preset-panel" role="group" aria-label="장수 프리셋">
                  <span class="preset-title">장수 프리셋</span>
                  <div class="sample-rosters">
                    <button class="ghost-button sample-button" type="button" data-sample-roster="cao">조조</button>
                    <button class="ghost-button sample-button" type="button" data-sample-roster="liu">유비</button>
                    <button class="ghost-button sample-button" type="button" data-sample-roster="sun">손권</button>
                    <button class="ghost-button sample-button" type="button" data-sample-roster="yuan">원소</button>
                  </div>
                </div>
              </details>
            </div>
            <textarea id="rosterInput" spellcheck="false" autocomplete="off"></textarea>
          </div>

          <div class="input-card roster-options">
            <label for="coreInput">코어 고정</label>
            <textarea id="coreInput" class="compact-textarea" spellcheck="false" autocomplete="off"></textarea>
            <div class="roster-limits">
              <label class="limit-field" for="groupCount">
                <span>목표 집단 수</span>
                <input id="groupCount" type="number" min="1" value="4" />
              </label>
              <label class="limit-field" for="maxSize">
                <span>집단 상한</span>
                <input id="maxSize" type="number" min="3" max="30" value="20" />
              </label>
              <button id="runButton" class="run-button roster-run-button" type="button" data-run-action>분석</button>
            </div>
          </div>

          <div id="duplicateSelectors" class="duplicate-selectors hidden"></div>
        </section>

        <section class="form-section single-panel hidden" data-panel="single">
          <div class="input-card single-entry">
            <div class="single-label-row">
              <label for="centerInput">분석 장수</label>
              <label for="hopDepth">탐색 단계</label>
            </div>
            <div class="single-row">
              <div class="single-search-field" id="singleSearchField">
                <input
                  id="centerInput"
                  autocomplete="off"
                  role="combobox"
                  aria-expanded="false"
                  aria-controls="singleOfficerDropdown"
                />
                <div id="singleOfficerDropdown" class="single-officer-dropdown hidden" role="listbox"></div>
              </div>
              <input id="hopDepth" type="number" min="1" max="4" value="4" />
              <button class="run-button" type="button" data-run-action>분석</button>
            </div>
          </div>
        </section>
      </section>

      <section class="result-pane">
        <div class="result-header">
          <div>
            <h2 id="resultTitle">보유 장수 편성 결과</h2>
            <p id="resultMeta">보유 장수를 입력하고 분석하세요.</p>
          </div>
          <div id="scoreBadge" class="score-badge">READY</div>
        </div>

        <div id="resultTabs" class="result-tabs" role="tablist" aria-label="결과 보기">
          <button class="result-tab active" type="button" data-result-tab="formation">편성 결과</button>
          <button class="result-tab" type="button" data-result-tab="oath">의형제/결혼 추천</button>
        </div>

        <div id="recommendationFilters" class="recommendation-filters hidden" aria-label="추천 필터">
          <label class="recommendation-filter">
            <input type="checkbox" data-rec-filter="oath" checked />
            <span>의형제</span>
          </label>
          <label class="recommendation-filter">
            <input type="checkbox" data-rec-filter="marriage" checked />
            <span>결혼</span>
          </label>
          <label class="recommendation-filter">
            <input type="checkbox" data-rec-filter="rescue" checked />
            <span>미편성 구제</span>
          </label>
          <label class="recommendation-filter">
            <input type="checkbox" data-rec-filter="support" checked />
            <span>응원/악주 보강</span>
          </label>
        </div>

        <div id="warnings" class="warnings"></div>
        <div id="results" class="results"></div>
        <div id="oathResults" class="results hidden"></div>
      </section>
    </main>

    <template id="groupTemplate">
      <article class="group-card">
        <div class="group-top">
          <h3></h3>
          <span class="group-score"></span>
        </div>
        <div class="member-list"></div>
        <div class="relation-list"></div>
      </article>
    </template>

    <script src="./data.js?v=1.4"></script>
    <script src="./app.js?v=1.4"></script>
  </body>
</html>
