<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="삼국지14CE 보유 장수 편성, 친애 관계 비교, 출진 후보와 진형 확인">
    <title>삼국지14 친애 편성기</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem("san14-theme"); } catch {}
        document.documentElement.dataset.theme = theme === "dark" || theme === "light"
          ? theme : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=5">
  </head>
  <body>
    <a class="skip-link" href="#content">본문으로 이동</a>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="brand-mark" aria-hidden="true">14</span><span>삼국지14 친애 편성기</span></div>
        <nav class="main-nav" aria-label="주 메뉴">
          <button type="button" data-view="planner" aria-current="page">편성</button>
          <button type="button" data-view="dex">장수 찾기</button>
        </nav>
        <button type="button" id="themeToggle" class="theme-button" aria-label="다크 테마로 변경">☾</button>
      </div>
    </header>

    <main id="content" class="page">
      <section id="planner-panel" aria-labelledby="planner-title">
        <div class="page-heading">
          <div>
            <h1 id="planner-title" tabindex="-1">보유 장수 편성</h1>
            <p>명단으로 편성을 만들고, 친애 관계와 출진 후보를 확인하세요.</p>
          </div>
          <button type="button" id="dataButton" class="button quiet">데이터 근거</button>
        </div>

        <section class="surface compact-roster" id="rosterCompact" aria-label="보유 장수 명단" hidden>
          <p><strong>보유 장수 명단</strong> <span class="muted" id="rosterCompactText"></span></p>
          <button type="button" class="button quiet small" id="editRoster">명단 수정</button>
        </section>

        <form novalidate id="rosterForm" class="surface roster-form">
          <div class="form-heading">
            <label class="section-title" for="rosterInput">보유 장수 명단</label>
            <details class="presets">
              <summary>프리셋 불러오기</summary>
              <div id="presets" class="preset-list"></div>
            </details>
          </div>
          <div class="form-grid">
            <div class="name-entry">
              <textarea id="rosterInput" rows="4" autocomplete="off" spellcheck="false"
                placeholder="유비, 관우, 장비, 조운, 제갈량" aria-describedby="rosterHint reviewMessage" style="resize: none"></textarea>
              <p id="rosterHint" class="help">쉼표, 공백 또는 줄바꿈으로 장수 이름을 구분합니다.</p>
            </div>
            <div class="settings">
              <label for="engineVersion">편성 방식</label>
              <select id="engineVersion"><option value="field">편성 알고리즘 v1.0</option><option value="legacy">기존 친애 편성</option></select>
              <label id="scenarioLabel" for="fieldScenario">초기 관계 시나리오</label>
              <select id="fieldScenario"><option value="01">황건의 난 (184년)</option><option value="06">한중쟁탈전 (217년)</option></select>
              <label for="groupCount">목표 집단 수</label>
              <select id="groupCount">
                <option value="auto">자동분할</option>
              </select>
              <label for="coreInput">고정 코어 <span class="muted">선택</span></label>
              <input id="coreInput" type="text" autocomplete="off" spellcheck="false" placeholder="예: 유비, 관우">
            </div>
          </div>
          <div id="nameReview" class="name-review" hidden>
            <p id="reviewMessage" class="help"></p>
            <div id="duplicateSelectors" class="fields"></div>
            <ul id="reviewWarnings" class="warnings" aria-label="명단 확인 결과" hidden></ul>
          </div>
          <div class="form-actions">
            <button class="button" id="checkNames" type="button">명단 확인</button>
            <button class="button primary" id="createPlan" type="submit">초안 만들기</button>
            <span id="busyMessage" class="help" aria-live="polite"></span>
          </div>
        </form>

        <div id="workspace"></div>
      </section>

      <section id="dex-panel" aria-labelledby="dex-title" hidden>
        <div class="page-heading">
          <div>
            <h1 id="dex-title" tabindex="-1">장수 찾기</h1>
            <p>이름, 개성, 진형으로 찾고 편성 명단에 추가할 수 있습니다.</p>
          </div>
        </div>
        <div class="surface dex-filter">
          <div class="search-field">
            <label for="dexSearch">검색</label>
            <div class="search-row">
              <input id="dexSearch" type="search" autocomplete="off" placeholder="예: 관우, 호위, 안행">
              <button id="clearSearch" class="button quiet" type="button" aria-label="검색어 지우기" hidden>지우기</button>
            </div>
          </div>
          <div class="filter-row">
            <div class="segmented" id="dexKinds" role="group" aria-label="검색 대상">
              <button data-dex-kind="officers" type="button" aria-pressed="true">장수</button>
              <button data-dex-kind="traits" type="button" aria-pressed="false">개성</button>
              <button data-dex-kind="formations" type="button" aria-pressed="false">진형</button>
            </div>
            <label class="check"><input id="ownedOnly" type="checkbox"> 보유 장수만</label>
            <label for="dexSort" class="inline-label">정렬
              <select id="dexSort">
                <option value="id">장수 번호순</option>
                <option value="name">이름순</option>
                <option value="leadership">통솔순</option>
                <option value="war">무력순</option>
                <option value="intelligence">지력순</option>
                <option value="politics">정치순</option>
                <option value="charm">매력순</option>
              </select>
            </label>
          </div>
        </div>
        <div id="dexResults"></div>
      </section>
    </main>

    <dialog id="detailDialog" class="detail-dialog" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <h2 id="dialogTitle" tabindex="-1"></h2>
        <button id="closeDialog" type="button" class="button quiet">닫기</button>
      </div>
      <div id="dialogBody"></div>
    </dialog>
    <p id="status" class="status" role="status" aria-atomic="true"></p>
    <footer class="footer">
      <span>삼국지14 친애 편성기</span>
      <a href="https://www.gamecity.ne.jp/manual/sangokushi14-pk/ce/kor/5110.html" target="_blank" rel="noopener">CE 공식 전투 매뉴얼</a>
    </footer>

    <script src="./data.js?v=4"></script>
    <script src="./model.js?v=5"></script>
    <script src="./roster.js?v=2"></script>
    <script src="./planner.js?v=4"></script>
    <script src="./recommendations.js?v=2"></script>
    <script src="./campaign.js?v=4"></script>
    <script src="./ui.js?v=4"></script>
    <script src="./formation-view.js?v=4"></script>
    <script src="./dex.js?v=4"></script>
    <script src="./field-model.js?v=2"></script>
    <script src="./field-planner.js?v=2"></script>
    <script src="./field-mediation.js?v=2"></script>
    <script src="./field-comparison.js?v=1"></script>
    <script src="./field-view.js?v=3"></script>
    <script src="./app.js?v=7"></script>
  </body>
</html>
